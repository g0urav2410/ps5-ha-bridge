name: "PS5 to MQTT Bridge"
version: "2.2.0"
slug: "ps5_mqtt_bridge"
description: "Polls a PS5's power state over the LAN, plus PSN presence (current game / home screen), and publishes it all to MQTT for Home Assistant automations."
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:sony-playstation
panel_title: "PS5 Bridge"
options:
  ps5_ip: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  poll_interval: 5
  presence_interval: 15
  device_name: "PlayStation 5"
schema:
  ps5_ip: str
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  poll_interval: int(2,300)
  presence_interval: int(5,600)
  device_name: str
